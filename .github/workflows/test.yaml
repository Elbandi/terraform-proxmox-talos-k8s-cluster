name: Workflow for building and pushing the chaosd extension

on:
  workflow_dispatch:
  push:
    branches:
      - build
      - tweaks

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        talos_version: [v1.11.3]
        arch: [amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Installer
        env:
          ARCH: ${{ matrix.arch }}
          OUTPUT: installer
        run: |
          envsubst <images/profile-proxmox.yaml | docker run --rm -i -v /dev:/dev --privileged \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -v "$PWD/_out:/out" \
            "ghcr.io/siderolabs/imager:${{ matrix.talos_version }}" -

      - name: Create ISO
        env:
          ARCH: ${{ matrix.arch }}
          OUTPUT: image
        run: |
          envsubst <images/profile-proxmox.yaml | docker run --rm -i -v /dev:/dev --privileged \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -v "$PWD/_out:/out" \
            "ghcr.io/siderolabs/imager:${{ matrix.talos_version }}" -

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.talos_version }}-${{ matrix.arch }}.iso"
          path: "_out/nocloud-${{ matrix.arch }}.iso"
