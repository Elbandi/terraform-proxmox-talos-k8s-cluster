---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lvm-setup
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: lvm
  template:
    metadata:
      labels:
        app: lvm
    spec:
      volumes:
      - name: hostfs
        hostPath:
          path: /
      containers:
      - image: alpine
        name: lvm-info
        volumeMounts:
        - name: hostfs
          mountPath: /hostfs
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          while sleep 60; do
            echo ----------------------------------------
            date
            for DEVICE in $(cd /hostfs;ls dev/disk/by-id/scsi-*lvm* 2>/dev/null); do
              chroot /hostfs/ pvdisplay -m /$DEVICE
            done
          done
      initContainers:
      - image: alpine
        name: lvm-setup
        volumeMounts:
        - name: hostfs
          mountPath: /hostfs
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          set -ex
            apk add --no-cache lvm2
            for DEVICE in $(cd /hostfs;ls dev/disk/by-id/scsi-*lvm* 2>/dev/null); do
              NAME=$(expr "$DEVICE" : '.*lvm-\([^\-]\+\)')
              DEVICE=$(realpath /hostfs/$DEVICE)
              if ! chroot /hostfs lvdisplay $NAME/pool &>/dev/null ; then
                echo "Creating $NAME-pool on ${DEVICE##/hostfs}."
                pvcreate --yes -ff ${DEVICE##/hostfs}
                vgcreate --yes $NAME ${DEVICE##/hostfs}
                lvcreate --yes -n MetadataLV -L 64M $NAME ${DEVICE##/hostfs}:0-31
                lvcreate --yes -n pool -l 100%FREE $NAME ${DEVICE##/hostfs}:32-
                lvconvert --yes --type thin-pool --poolmetadata MetadataLV $NAME/pool
              fi
              chroot /hostfs/ pvdisplay -m ${DEVICE##/hostfs}
            done
